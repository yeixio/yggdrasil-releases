name: Bug
description: Something in a released build does not work.
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what the app did instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Build
      description: The version from the download page or the About window, such as 0.1.0-alpha.23.
      placeholder: 0.1.0-alpha.23
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux desktop
        - Linux server
    validations:
      required: true
